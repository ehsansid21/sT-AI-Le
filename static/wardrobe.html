<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Outfit Stylist - Wardrobe</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Digital Wardrobe</h1>
            <p>Upload your clothes to get personalized recommendations.</p>
            <nav class="nav-tabs">
                <a href="index.html">Outfit Stylist</a>
                <a href="shopping.html">Shopping Advice</a>
                <a href="wardrobe.html" class="active">My Wardrobe</a>
            </nav>
        </header>

        <main>
            <div class="card form-section">
                <h2>Add New Item</h2>
                <form id="wardrobe-form">
                    <div class="form-group">
                        <label for="item-name">Item Name</label>
                        <input type="text" id="item-name" name="name" placeholder="e.g., Favorite Blue Jeans" required>
                    </div>

                    <div class="form-group">
                        <label for="item-category">Category</label>
                        <select id="item-category" name="category" required>
                            <option value="Top">Top (Shirts, T-shirts, etc.)</option>
                            <option value="Bottom">Bottom (Jeans, Trousers, etc.)</option>
                            <option value="Outerwear">Outerwear (Jackets, Coats)</option>
                            <option value="Shoes">Shoes</option>
                            <option value="Accessory">Accessory</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="item-color">Dominant Color</label>
                        <input type="text" id="item-color" name="color" placeholder="e.g., Navy Blue" required>
                    </div>

                    <div class="form-group">
                        <label for="image-upload">Upload Photo (Optional)</label>
                        <p class="help-text">Please upload a clear picture of the clothing item.</p>
                        <input type="file" id="image-upload" name="image" accept="image/*">
                        <div id="image-preview" class="hidden"></div>
                    </div>

                    <button type="submit" id="add-btn">Add to Wardrobe</button>
                    <div id="upload-status" class="hidden" style="margin-top: 1rem; text-align: center; color: #10b981;"></div>
                </form>
            </div>

            <div class="card result-section">
                <h2>Your Items</h2>
                <div id="wardrobe-grid" class="wardrobe-grid">
                    <!-- Items will be populated here -->
                </div>
            </div>
        </main>
    </div>
    <script src="app.js?v=7"></script>
</body>
</html>
